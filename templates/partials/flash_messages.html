{# Server-side flash messages (Flask flash()). Rendered with autoescaping. #}
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="mb-3" role="status">
      {% for category, message in messages %}
        <div class="alert alert-{{ category if category in ['success','danger','warning','info'] else 'info' }} alert-dismissible fade show py-2" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
